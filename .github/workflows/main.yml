name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake

  integration:
    name: Dummy Rails app on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Ruby versions the gem supports; keep in sync with the build job.
        # Rails itself is unpinned, so this always exercises the latest release.
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    defaults:
      run:
        working-directory: test/dummy_rails_app
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        working-directory: test/dummy_rails_app
    - run: bundle install
    - run: bin/rails test:system
    - name: Upload generated documents
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: siyousho-output-ruby-${{ matrix.ruby }}
        path: test/dummy_rails_app/tmp/仕様書
        if-no-files-found: ignore
