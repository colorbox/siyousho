inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.3
  Exclude:
    # Fixture Rails app used by the integration test; not linted as gem code.
    - 'test/dummy_rails_app/**/*'

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
